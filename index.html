    <meta
      name="description"
      content="Peak Mode International — Performance sportswear manufacturer. Jerseys, training, hoodies, tracksuits, compression and OEM/ODM. Built for the American market."
    />
    <title>Peak Mode International — Performance Sportswear Manufacturer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  <script>
      (function () {
        var base = "/peakmode";
        var p = location.pathname;
        if (p !== base && p.indexOf(base + "/") !== 0) return;
        if (location.hash) return;
        var rest = p.slice(base.length).replace(/\/+$/, "");
        if (rest) location.replace(base + "/#" + rest + location.search);
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
