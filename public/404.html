<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peak Mode International — Redirecting</title>
    <script>
      (function () {
        var base = "/peakmode";
        var path = location.pathname.replace(/\/+$/, "");
        var rest = path === base ? "" : path.replace(new RegExp("^" + base.replace(/\//g, "\\/")), "");
        location.replace(base + "/#" + rest + location.search);
      })();
    </script>
  </head>
  <body></body>
</html>
